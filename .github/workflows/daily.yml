name: daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily

jobs:
  waves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node dist/cli.js --json > /tmp/snapshot.json
          mv /tmp/snapshot.json docs/latest.json
          gzip -9 -c docs/latest.json > "data/$(date -u +%F).json.gz"
          node dist/cli.js --from docs/latest.json --md --top 10 > /tmp/waves.md
          node scripts/readme.mjs /tmp/waves.md
          node scripts/svg.mjs docs/latest.json assets/waves.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/latest.json assets/waves.svg README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m "waves: $(date -u +%F)"
            git push
          fi
